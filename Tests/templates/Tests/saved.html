{% extends 'Tests/base.html' %}

{% block content %}

<div style="display:flex; align-items:center; gap:12px; margin: 8px 0 20px;">
  <a href="{% url 'profile' %}" class="icon-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <h1 style="font-size: 20px; font-weight: 700;">Saved papers</h1>
</div>

<div id="saved-list"></div>

<div id="saved-empty" class="empty-state" style="display:none;">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
  </div>
  <h3>Nothing saved yet</h3>
  <p>Tap "Save offline" on any paper to keep it here for quick access.</p>
  <a href="{% url 'search' %}" class="btn" style="max-width: 200px; margin: 0 auto;">Browse papers</a>
</div>

{% endblock %}

{% block scripts %}
<script>
function renderSaved() {
  const list = document.getElementById('saved-list');
  const empty = document.getElementById('saved-empty');
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem('saved_papers') || '[]'); }
  catch (e) { saved = []; }

  if (saved.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = saved.map(function (p) {
    return ''
      + '<a href="/paper/' + p.id + '/" class="card">'
      +   '<div class="card-left">'
      +     '<span class="unit-chip">' + (p.unit_code || '') + '</span>'
      +     '<div class="card-title">' + (p.title || '') + '</div>'
      +     '<div class="card-meta">' + (p.year || '') + '</div>'
      +   '</div>'
      +   '<button class="icon-btn" onclick="event.preventDefault(); removeSaved(' + p.id + ')" aria-label="Remove">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">'
      +       '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
      +     '</svg>'
      +   '</button>'
      + '</a>';
  }).join('');
}

window.removeSaved = function (id) {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem('saved_papers') || '[]'); }
  catch (e) { saved = []; }
  saved = saved.filter(function (p) { return p.id !== id; });
  localStorage.setItem('saved_papers', JSON.stringify(saved));
  renderSaved();
  showToast('Removed from saved', 'default');
};

document.addEventListener('DOMContentLoaded', renderSaved);
</script>
{% endblock %}
