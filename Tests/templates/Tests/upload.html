{% extends 'Tests/base.html' %}

{% block content %}

<h1 style="font-size: 22px; font-weight: 700; margin: 8px 0 20px;">Upload a paper</h1>

{% if error %}
  <div class="info-banner" style="background:var(--danger-bg); border-color:#FECACA; color:var(--danger);">
    <span>{{ error }}</span>
  </div>
{% endif %}

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}

  <input type="file" name="paper_file" id="file-input" accept=".pdf,image/*" style="display:none;">
  <input type="file" name="paper_file_camera" id="camera-input" accept="image/*" capture="environment" style="display:none;">

  <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
    <div class="plus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
      </svg>
    </div>
    <p id="file-label">Tap to select PDF or image</p>
    <p class="hint">Max 10 MB · PDF, JPG, PNG</p>
  </div>

  <div id="file-preview" class="card" style="display:none; align-items:center;">
    <div class="card-left" style="display:flex; align-items:center; gap:10px;">
      <div style="width:36px; height:36px; border-radius:var(--r-md); background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div style="min-width:0;">
        <div id="preview-name" style="font-weight:600; font-size:13px; word-break:break-all;">filename.pdf</div>
        <div id="preview-size" class="text-muted" style="font-size:11px;">0 KB</div>
      </div>
    </div>
    <button type="button" onclick="removeFile()" class="icon-btn" style="color:var(--danger);" aria-label="Remove file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div style="display:flex; gap:8px; margin-bottom: 20px;">
    <button type="button" class="btn btn-outline" style="flex:1;" onclick="document.getElementById('file-input').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
      </svg>
      Choose file
    </button>
    <button type="button" class="btn btn-outline" style="flex:1;" onclick="document.getElementById('camera-input').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Take photo
    </button>
  </div>

  <div class="form-group">
    <label>Unit code *</label>
    <input type="text" name="unit_code" placeholder="CS201" required>
  </div>

  <div class="form-group">
    <label>Title / Course name *</label>
    <input type="text" name="title" placeholder="Data Structures" required>
  </div>

  <div class="form-group">
    <label>Course category *</label>
    <input type="text" name="course" placeholder="Computer Science" required>
  </div>

  <div class="form-group">
    <label>University *</label>
    <select name="university" required>
      {% for value, label in universities %}
        <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label>Short description</label>
    <textarea name="description" placeholder="Optional notes about this paper" rows="3"></textarea>
  </div>

  <div class="form-group">
    <label>Campus</label>
    <select name="campus" id="campus-select">
      {% for value, label in campuses %}
        <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label>Year</label>
    <input type="number" name="year" placeholder="2024" min="2000" max="2030" required>
  </div>

  <div class="form-group">
    <label>Exam type</label>
    <select name="exam_type">
      {% for value, label in exam_types %}
        <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label>Your name</label>
    <input type="text" name="uploader_name" value="{{ user_name }}" required>
  </div>

  <div class="info-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
    </svg>
    <span>Your upload will be reviewed before going live.</span>
  </div>

  <button type="submit" class="btn">Submit for verification</button>
</form>

{% endblock %}

{% block scripts %}
<script>
const fileInput = document.getElementById('file-input');
const cameraInput = document.getElementById('camera-input');
const uploadZone = document.getElementById('upload-zone');
const filePreview = document.getElementById('file-preview');
const previewName = document.getElementById('preview-name');
const previewSize = document.getElementById('preview-size');
const fileLabel = document.getElementById('file-label');

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function showFilePreview(file) {
  previewName.textContent = file.name;
  previewSize.textContent = formatSize(file.size);
  filePreview.style.display = 'flex';
  fileLabel.textContent = 'File selected';
  fileLabel.style.color = 'var(--success)';
  uploadZone.style.display = 'none';
}

window.removeFile = function () {
  fileInput.value = '';
  cameraInput.value = '';
  filePreview.style.display = 'none';
  uploadZone.style.display = 'block';
  fileLabel.textContent = 'Tap to select PDF or image';
  fileLabel.style.color = '';
};

if (fileInput) {
  fileInput.addEventListener('change', function () {
    if (this.files.length > 0) {
      cameraInput.value = '';
      showFilePreview(this.files[0]);
    }
  });
}

if (cameraInput) {
  cameraInput.addEventListener('change', function () {
    if (this.files.length > 0) {
      fileInput.value = '';
      showFilePreview(this.files[0]);
    }
  });
}

const UNIVERSITY_CAMPUSES = {
  'uon': [['main','Main Campus'],['kikuyu','Kikuyu Campus'],['chiromo','Chiromo Campus'],['lower_kabete','Lower Kabete Campus'],['parklands','Parklands Campus'],['kisumu','Kisumu Campus']],
  'ku': [['main','Main Campus (Thika)'],['ruiru','Ruiru Campus'],['parklands','Parklands Campus'],['city','City Campus'],['kericho','Kericho Campus'],['nakuru','Nakuru Campus']],
  'strathmore': [['main','Main Campus (Madaraka)'],['cbd','CBD Campus']],
  'jkuat': [['main','Main Campus (Juja)'],['nairobi','Nairobi CBD Campus'],['karen','Karen Campus'],['mombasa','Mombasa Campus'],['kisii','Kisii Campus']],
  'moi': [['main','Main Campus (Eldoret)'],['town','Town Campus'],['nairobi','Nairobi Campus']],
  'egerton': [['main','Main Campus (Njoro)'],['nakuru','Nakuru Campus'],['njoro','Njoro Campus']],
  'maseno': [['main','Main Campus'],['kisumu','Kisumu Campus']],
  'tuk': [['main','Main Campus'],['cbd','CBD Campus']],
  'mmu': [['main','Main Campus']],
  'daystar': [['athi_river','Athi River Campus'],['nairobi','Nairobi Campus']],
  'usiu': [['main','Main Campus']],
  'cuea': [['main','Main Campus'],['karen','Karen Campus']],
  'anu': [['main','Main Campus']],
  'mku': [['main','Main Campus (Thika)'],['nairobi','Nairobi Campus'],['mombasa','Mombasa Campus']],
  'zetech': [['main','Main Campus']],
  'riara': [['main','Main Campus']],
  'other': [['main','Main Campus'],['other','Other']],
};

function updateCampuses(uniCode) {
  const campusSelect = document.getElementById('campus-select');
  if (!campusSelect) return;
  const campuses = UNIVERSITY_CAMPUSES[uniCode] || UNIVERSITY_CAMPUSES['other'];
  campusSelect.innerHTML = '';
  campuses.forEach(function (pair) {
    const opt = document.createElement('option');
    opt.value = pair[0];
    opt.textContent = pair[1];
    campusSelect.appendChild(opt);
  });
}

document.addEventListener('DOMContentLoaded', function () {
  const uniSelect = document.querySelector('select[name="university"]');
  if (uniSelect) {
    uniSelect.addEventListener('change', function () {
      updateCampuses(this.value);
    });
    updateCampuses(uniSelect.value);
  }
});
</script>
{% endblock %}
